<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: rgb(242,242,245); }
    a { color: rgb(0,122,255); } a:hover { color: rgb(0,96,205); }
  </style>
</helmet>
<div style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px">
  <div style="position:relative; width:324px; height:700px">
    <div style="position:absolute; left:-13px; top:157px; width:4px; height:28px; border-radius:2px 0 0 2px; background:rgb(45,45,48)"></div>
    <div style="position:absolute; left:-13px; top:210px; width:4px; height:56px; border-radius:2px 0 0 2px; background:rgb(45,45,48)"></div>
    <div style="position:absolute; left:-13px; top:280px; width:4px; height:56px; border-radius:2px 0 0 2px; background:rgb(45,45,48)"></div>
    <div style="position:absolute; right:-13px; top:219px; width:4px; height:88px; border-radius:0 2px 2px 0; background:rgb(45,45,48)"></div>
    <div style="position:relative; width:324px; height:700px; border-radius:24px; overflow:hidden; box-shadow:0 0 0 9px rgb(20,20,22), 0 0 0 10px rgba(255,255,255,0.08), 0 0 0 11px rgb(60,60,64), 0 24px 60px rgba(0,0,0,0.25)">
    <div data-screen-label="Video screen"
         onDrop="{{ handleDrop }}" onDragOver="{{ handleDragOver }}" onClick="{{ handlePick }}"
         style="position:absolute; inset:0; background:rgb(255,255,255); display:flex; align-items:center; justify-content:center; cursor:pointer; overflow:hidden">
      <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute; inset:0">{{ videoEl }}</div>
      </sc-if>
      <sc-if value="{{ noVideo }}" hint-placeholder-val="{{ true }}">
        <div style="display:flex; flex-direction:column; align-items:center; gap:12px; color:rgb(140,140,150); font:500 15px/1.4 -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif; text-align:center; padding:0 40px">
          <div style="width:56px; height:56px; border-radius:28px; border:2px dashed rgb(200,200,210); display:flex; align-items:center; justify-content:center; font-size:24px; color:rgb(180,180,190)">▶</div>
          <div>Drop a video here<br>or click to choose a file</div>
        </div>
      </sc-if>
      <div style="position:absolute; top:12px; left:50%; transform:translateX(-50%); width:98px; height:26px; border-radius:13px; background:rgb(20,20,22); pointer-events:none"></div>
      <div style="position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:120px; height:5px; border-radius:3px; background:rgba(0,0,0,0.35); pointer-events:none"></div>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:460,&quot;height&quot;:860}}">
class Component extends DCLogic {
  state = { videoUrl: null };

  componentDidMount() {
    this._openDb().then((db) => {
      const tx = db.transaction('files', 'readonly');
      const req = tx.objectStore('files').get('screen-video-black');
      req.onsuccess = () => {
        if (req.result) this.setState({ videoUrl: URL.createObjectURL(req.result) });
      };
    }).catch(() => {});
  }

  _openDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('iphone-video-mockup', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('files');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  _setVideo(file) {
    if (!file || !file.type.startsWith('video/')) return;
    this.setState({ videoUrl: URL.createObjectURL(file) });
    this._openDb().then((db) => {
      db.transaction('files', 'readwrite').objectStore('files').put(file, 'screen-video-black');
    }).catch(() => {});
  }

  renderVals() {
    const url = this.state.videoUrl;
    return {
      hasVideo: !!url,
      noVideo: !url,
      videoEl: url ? React.createElement('video', {
        key: url, src: url, autoPlay: true, loop: true, muted: true, playsInline: true,
        style: { width: '100%', height: '100%', objectFit: 'cover', display: 'block' },
      }) : null,
      handleDragOver: (e) => e.preventDefault(),
      handleDrop: (e) => {
        e.preventDefault();
        this._setVideo(e.dataTransfer.files && e.dataTransfer.files[0]);
      },
      handlePick: () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'video/*';
        input.onchange = () => this._setVideo(input.files[0]);
        input.click();
      },
    };
  }
}
</script>
</body>
</html>
