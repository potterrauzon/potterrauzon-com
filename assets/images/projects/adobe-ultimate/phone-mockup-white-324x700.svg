<svg xmlns="http://www.w3.org/2000/svg" width="352" height="728" viewBox="0 0 352 728">
  <defs>
    <mask id="screenHole" maskUnits="userSpaceOnUse" x="0" y="0" width="352" height="728">
      <rect x="0" y="0" width="352" height="728" fill="#ffffff"/>
      <rect x="14" y="14" width="324" height="700" rx="24" fill="#000000"/>
    </mask>
  </defs>

  <!-- side buttons (behind the frame, so only the protruding tab shows) -->
  <rect x="1" y="171" width="4" height="28" rx="2" fill="rgb(205,205,210)"/>
  <rect x="1" y="224" width="4" height="56" rx="2" fill="rgb(205,205,210)"/>
  <rect x="1" y="294" width="4" height="56" rx="2" fill="rgb(205,205,210)"/>
  <rect x="347" y="233" width="4" height="88" rx="2" fill="rgb(205,205,210)"/>

  <!-- bezel rings, masked with a rounded hole where the video shows through -->
  <g mask="url(#screenHole)">
    <rect x="3" y="3" width="346" height="722" rx="35" fill="rgb(224,224,229)"/>
    <rect x="4" y="4" width="344" height="720" rx="34" fill="#000000" fill-opacity="0.08"/>
    <rect x="5" y="5" width="342" height="718" rx="33" fill="rgb(252,252,253)"/>
  </g>

  <!-- home indicator, drawn over the transparent video area -->
  <rect x="116" y="702" width="120" height="5" rx="2.5" fill="#000000" fill-opacity="0.35"/>
</svg>
